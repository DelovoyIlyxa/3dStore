<!-- views/shop/payment_success.html-->
{% extends "base.html" %}

{% block content %}
<div style="text-align:center; max-width:600px; margin:60px auto;">
    <div style="font-size:80px; color:#28a745; margin-bottom:20px;">
        <i class="fas fa-check-circle"></i>
    </div>
    <h1 style="font-size:36px; margin-bottom:20px;">Оплата прошла успешно!</h1>
    <p style="font-size:18px; color:var(--text-secondary); margin-bottom:30px;">
        Вы приобрели модель: <strong>{{ product.title }}</strong>
    </p>
    
    <div style="background:var(--card-bg); border-radius:12px; padding:24px; margin:30px 0;">
        <div style="font-size:24px; margin-bottom:16px;">🎟️ Итог</div>
        <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);">
            <span>Модель</span>
            <strong>{{ product.title }}</strong>
        </div>
        <div style="display:flex; justify-content:space-between; padding:12px 0;">
            <span>Сумма</span>
            <strong style="color:#ff2a6d;">{{ "%.2f"|format(product.price) }} $</strong>
        </div>
    </div>

    <a href="{{ url_for('shop.product_detail', product_id=product.id) }}" class="btn" style="background:#28a745; width:240px;">
        <i class="fas fa-download"></i> Назад к товару
    </a>
</div>
{% endblock %}
